[project]
name = "radio-parser"
version = "0.1.0"
description = "Parse Taiwan police radio (警廣) traffic reports into map bounding boxes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
radio-parser = "radio_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
